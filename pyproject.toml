[project]
name = "open-rag-engine"
version = "0.1.0"
description = "Production-grade, evaluated retrieval-augmented generation over legal contracts."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ore = "open_rag_engine.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_rag_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "PT", "TID", "ARG", "PL",
]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: needs external services such as Postgres (Testcontainers)",
    "e2e: runs against the composed stack",
]

[tool.coverage.run]
source = ["open_rag_engine"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    '^\s*\.\.\.$',
]
